name: Build Ocean Quest ExternalCamera APK

on:
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-quest-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl
          pip install -r build/python/requirements.txt

      - name: Set up Android SDK and NDK (preinstalled on runner)
        run: |
          set +e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1
          NDK_VER=$(grep -rhoE 'ndkVersion\s*=\s*"[^"]+"' build/gradle | head -1 | grep -oE '"[^"]+"' | tr -d '"')
          NDK_VER=${NDK_VER:-26.1.10909125}
          echo "Using NDK $NDK_VER"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            "$SDKM" "ndk;$NDK_VER" || { echo "NDK install failed"; exit 1; }
          fi
          echo "ANDROID_NDK_VERSION=$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV

      - name: Patch curl to build without TLS (not needed for camera app)
        run: |
          F=build/python/dependencies.yaml
          sed -i -E 's/^(\s*CURL_ENABLE_SSL:\s*)ON/\1OFF/' $F
          sed -i -E 's/^(\s*CURL_USE_MBEDTLS:\s*)ON/\1OFF/' $F
          echo "--- patched lines ---"
          grep -nE "CURL_ENABLE_SSL|CURL_USE_MBEDTLS" $F

      - name: Build third-party libraries
        run: |
          python build/python/build_ocean_3rdparty.py --target android_arm64 --log-level verbose 2>&1 | tee 3rdparty.log
          exit ${PIPESTATUS[0]}

      - name: Show failing library logs
        if: failure()
        run: |
          for f in $(grep -rlE "CMake Error|FAILED:|error:" ocean_3rdparty/build --include=build.log | head -3); do
            echo "=========== $f"
            grep -nE -A6 "CMake Error|FAILED:|error:" "$f" | head -40
          done

      - name: Build ExternalCamera APK
        run: |
          export OCEAN_DEVELOPMENT_PATH="$GITHUB_WORKSPACE"
          export OCEAN_THIRDPARTY_PATH="$GITHUB_WORKSPACE/ocean_3rdparty/install"
          APP_DIR=$(find build/gradle -type d -path '*externalcamera/quest' | head -1)
          echo "App dir: $APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
          exit ${PIPESTATUS[0]}

      - name: Show gradle errors on failure
        if: failure()
        run: |
          grep -nE -B2 -A8 "FAILURE|error:|What went wrong" gradle.log | head -60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExternalCamera-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            3rdparty.log
            gradle.log
            ocean_3rdparty/build/**/build.log
