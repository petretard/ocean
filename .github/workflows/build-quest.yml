name: Build Ocean Quest ExternalCamera APK

on:
  workflow_dispatch:

jobs:
  build-quest-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl
          pip install -r build/python/requirements.txt

      - name: Install NDK (version taken from Ocean's gradle files)
        run: |
          NDK_VER=$(grep -rhoE 'ndkVersion\s*=\s*"[^"]+"' build/gradle | head -1 | grep -oE '"[^"]+"' | tr -d '"' || true)
          NDK_VER=${NDK_VER:-26.1.10909125}
          echo "Using NDK $NDK_VER"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;$NDK_VER" "platform-tools"
          echo "ANDROID_NDK_VERSION=$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV

      - name: Build third-party libraries
        run: |
          python build/python/build_ocean_3rdparty.py --target android_arm64 --log-level verbose 2>&1 | tee 3rdparty.log
          exit ${PIPESTATUS[0]}

      - name: Build ExternalCamera APK
        run: |
          export OCEAN_DEVELOPMENT_PATH="$GITHUB_WORKSPACE"
          export OCEAN_THIRDPARTY_PATH="$GITHUB_WORKSPACE/ocean_3rdparty/install"
          APP_DIR=$(find build/gradle -type d -path '*externalcamera/quest' | head -1)
          echo "App dir: $APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExternalCamera-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            3rdparty.log
            gradle.log
