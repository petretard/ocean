name: Build Ocean Quest ExternalCamera APK

on:
  workflow_dispatch:

jobs:
  build-quest-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Ocean repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build tools & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config zip unzip curl
          python -m pip install --upgrade pip
          if [ -f build/python/requirements.txt ]; then
            pip install -r build/python/requirements.txt
          fi

      - name: Install Android NDK 26 & Build-Tools
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-32" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=26.3.11579264" >> $GITHUB_ENV

      - name: Build Ocean 3rd-party libraries (Android)
        run: |
          python build/python/build_ocean_3rdparty.py \
            --target android \
            --android-api-level 29 \
            --config release \
            --verbose \
            --install-dir "$HOME/install_ocean_thirdparty" || {
              echo "=== CURL BUILD LOG ==="
              find /home/runner/work/ocean/ocean/ocean_3rdparty/build/curl -name "build.log" -exec tail -n 80 {} +
              exit 1
            }

      - name: Locate & Build ExternalCamera Quest APK
        run: |
          export OCEAN_THIRDPARTY_PATH="$HOME/install_ocean_thirdparty"
          echo "=== Inspecting Quest Gradle/CMake paths ==="
          find build -maxdepth 8 -iname "*externalcamera*" -o -iname "*quest*"
          
          GRADLE_DIR=$(find build/gradle -type d -iname "*externalcamera*" | head -n 1)
          if [ -n "$GRADLE_DIR" ] && [ -f "$GRADLE_DIR/gradlew" ]; then
            echo "Found Gradle project at: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            echo "Fallback: building via build_ocean.py"
            python build/python/build_ocean.py \
              --platform android \
              --arch arm64 \
              --config release \
              --third-party-dir "$OCEAN_THIRDPARTY_PATH"
          fi

      - name: Collect generated APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output_apks"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apks/" \;
          ls -lh "$GITHUB_WORKSPACE/output_apks/"

      - name: Upload Quest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocean-quest-externalcamera-apk
          path: output_apks/*.apk
          if-no-files-found: error
