name: Collect source for depth patch

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather files
        run: |
          mkdir -p out
          D=impl/application/ocean/demo/platform/meta/quest/openxr/depth
          for f in $(find $D -type f | sort) \
                   impl/application/ocean/demo/media/externalcamera/CMakeLists.txt \
                   impl/ocean/rendering/Utilities.h \
                   impl/ocean/rendering/BlendAttribute.h \
                   impl/ocean/rendering/FrameTexture2D.h \
                   impl/ocean/rendering/Texture2D.h; do
            if [ -f "$f" ]; then
              echo "=============== $f ==============="
              cat "$f"
              echo
            fi
          done > out/source_files2.txt
          wc -c out/*

      - uses: actions/upload-artifact@v4
        with:
          name: source-files-2
          path: out/
